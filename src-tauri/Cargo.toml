[package]
name = "cream-corners"
version = "0.1.0"
description = "Cream Corners - hot corners for Windows 10/11"
authors = ["Canopus44"]
repository = "https://github.com/Canopus44/cream-corners"
homepage = "https://canopus44.github.io/cream-corners/"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cream_corners_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
